{% extends "base.html" %}

{% block title %}Nova Etapa - Controle de Tarefas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Nova Etapa</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="bi bi-diagram-3"></i> Tarefa: <strong>{{ tarefa.tarefa }}</strong>
                </div>
                <form method="POST" action="{{ url_for('nova_etapa', id=tarefa.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Titulo *</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required maxlength="200" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descricao</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Detalhes operacionais da etapa..."></textarea>
                        <small class="form-text text-muted">Opcional</small>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="ordem" class="form-label">Ordem *</label>
                            <input type="number" class="form-control" id="ordem" name="ordem" min="1" value="{{ proxima_ordem }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status *</label>
                            <select class="form-select" id="status" name="status" required>
                                {% for status in status_permitidos %}
                                <option value="{{ status }}" {% if status == 'Criada' %}selected{% endif %}>{{ status }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="data_planejada" class="form-label">Data planejada</label>
                            <input type="date" class="form-control" id="data_planejada" name="data_planejada">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="hora_inicio" class="form-label">Hora inicio</label>
                            <input type="time" class="form-control" id="hora_inicio" name="hora_inicio">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="hora_fim" class="form-label">Hora fim</label>
                            <input type="time" class="form-control" id="hora_fim" name="hora_fim">
                        </div>
                    </div>

                    <div class="form-actions justify-content-between">
                        <a href="{{ url_for('listar_etapas_tarefa', id=tarefa.id) }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Cadastrar Etapa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
